name: JobHuntManager
options:
  bundleIdPrefix: com.towa.jobhuntmanager
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  JobHuntManager:
    type: application
    platform: iOS
    sources:
      - path: JobHuntManager
    info:
      path: JobHuntManager/Info.plist
      properties:
        UILaunchScreen: {}
        CFBundleDisplayName: 就活管理
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.towa.jobhuntmanager
        ASSETSCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"

  JobHuntManagerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: JobHuntManagerTests
    dependencies:
      - target: JobHuntManager
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.towa.jobhuntmanager.tests
        GENERATE_INFOPLIST_FILE: true
    scheme:
      testTargets:
        - JobHuntManager

schemes:
  JobHuntManager:
    build:
      targets:
        JobHuntManager: all
        JobHuntManagerTests: [test]
    test:
      targets:
        - JobHuntManagerTests
    run:
      config: Debug
